name: Publish Sfumato APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sfumato-Android-1.0.2-source.zip"
      - ".github/workflows/publish-sfumato.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified source
        run: unzip -q Sfumato-Android-1.0.2-source.zip -d source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build installable APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Prepare release asset
        run: cp source/app/build/outputs/apk/debug/app-debug.apk Sfumato-1.0.2.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.2 Sfumato-1.0.2.apk Sfumato-Android-1.0.2-source.zip --title "Sfumato 1.0.2" --notes "Installable Android build with the Enoch Live cancellation fix." --latest
